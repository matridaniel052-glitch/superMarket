{% extends 'base.html' %}
{% block title %}Edit Supplier — Matri-Link IMS{% endblock %}
{% block page_header %}
<div class="page-header">
  <h1>Edit supplier</h1>
  <p>Update details for "{{ supplier.name }}"</p>
</div>
{% endblock %}
{% block content %}
<div style="max-width:600px;">
  <div class="card">
    <form method="POST" action="{{ url_for('suppliers.edit', id=supplier.id) }}">
      <div class="field">
        <label>Company / Supplier name *</label>
        <input type="text" name="name" value="{{ supplier.name }}" required autofocus>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Contact person</label>
          <input type="text" name="contact" value="{{ supplier.contact or '' }}">
        </div>
        <div class="field">
          <label>Phone number</label>
          <input type="text" name="phone" value="{{ supplier.phone or '' }}">
        </div>
      </div>
      <div class="field">
        <label>Email address</label>
        <input type="email" name="email" value="{{ supplier.email or '' }}">
      </div>
      <div class="field">
        <label>Address</label>
        <input type="text" name="address" value="{{ supplier.address or '' }}">
      </div>
      <div class="field">
        <label>Payment terms</label>
        <input type="text" name="payment_terms" value="{{ supplier.payment_terms or '' }}">
      </div>
      <div style="display:flex;gap:10px;margin-top:0.5rem;">
        <button type="submit" class="btn btn-green">Update supplier</button>
        <a href="{{ url_for('suppliers.index') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
